version: "3.1"

rules:
- rule: Answer documentation questions
  steps:
    - intent: ask_documentation
    - action: action_answer_from_markdown

- rule: Load markdown document
  steps:
    - intent: provide_markdown_url
    - action: action_load_markdown

- rule: Summarize active document
  steps:
    - intent: summarize_document
    - action: action_summarize_document

- rule: Explain setup steps from active document
  steps:
    - intent: explain_setup
    - action: action_explain_setup

- rule: Extract commands from active document
  steps:
    - intent: extract_commands
    - action: action_extract_commands

- rule: Show troubleshooting guidance
  steps:
    - intent: show_troubleshooting
    - action: action_show_troubleshooting

- rule: Compare loaded documents
  steps:
    - intent: compare_documents
    - action: action_compare_documents

- rule: Reset loaded documents
  steps:
    - intent: reset_document
    - action: action_reset_documents

- rule: List loaded documents
  steps:
    - intent: list_documents
    - action: action_list_documents

- rule: Switch active document
  steps:
    - intent: switch_document
    - action: action_switch_document

- rule: Say goodbye anytime the user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

- rule: Explain what the bot can do
  steps:
    - intent: ask_help
    - action: utter_help

- rule: Handle uncertain messages
  steps:
    - intent: nlu_fallback
    - action: utter_fallback

- rule: Ask for markdown URL when user wants to load a document
  steps:
    - intent: request_load_document
    - action: utter_ask_markdown_url

